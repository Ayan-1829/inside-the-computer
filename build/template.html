<!DOCTYPE html>
<html lang="en" data-theme="light" data-root="{{ROOT}}" data-site="{{SITE}}" data-node="{{ID}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Generated by build/build.mjs from build/template.html. Edit the template or the data files, not this output. -->

<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="keywords" content="{{KEYWORDS}}">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
<link rel="canonical" href="{{CANONICAL}}">
<meta name="application-name" content="Inside the Computer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#EDF0EC">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1613">

<meta property="og:type" content="{{OGTYPE}}">
<meta property="og:site_name" content="Inside the Computer">
<meta property="og:locale" content="en_US">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:image" content="{{SITE}}og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The Inside the Computer explorer showing a desktop PC with its side panel removed.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESC}}">
<meta name="twitter:image" content="{{SITE}}og-image.png">

<link rel="icon" type="image/svg+xml" href="{{ROOT}}favicon.svg">
<link rel="sitemap" type="application/xml" href="{{SITE}}sitemap.xml">
<script type="application/ld+json" id="ld-page">{{JSONLD}}</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ROOT}}css/styles.css">
<script>
  /* Set the theme before first paint to avoid a flash */
  (function(){ var t = null; try { t = localStorage.getItem('itc-theme'); } catch(e){}
    document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); })();
</script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="{{HOME}}" aria-label="Inside the Computer, go to the start">
      <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="var(--accent)"/><rect x="18" y="18" width="28" height="28" rx="4" fill="var(--bg)"/><path d="M24 10v8M32 10v8M40 10v8M24 46v8M32 46v8M40 46v8M10 24h8M10 32h8M10 40h8M46 24h8M46 32h8M46 40h8" stroke="var(--bg)" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="32" r="5" fill="var(--signal)"/></svg>
      <p class="brand-name">Inside the Computer</p>
    </a>
    <div class="spacer"></div>
    <button class="btn" id="btn-overview" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2.5" y="2.5" width="6" height="5" rx="1.2"/><path d="M5.5 7.5v8h4M5.5 11.5h4"/><rect x="11.5" y="9" width="6" height="5" rx="1.2"/></svg>
      <span class="lbl">Overview</span></button>
    <button class="btn icon" id="btn-theme" type="button" aria-label="Switch theme"></button>
  </header>

  <div class="toolbar">
    <button class="btn" id="btn-back" type="button" aria-label="Go back one level">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5 6.5 10l5.5 5.5"/></svg><span class="lbl">Back</span></button>
    <button class="btn icon" id="btn-home" type="button" aria-label="Go to the whole computer and reset">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.2 10 3.5l7 5.7V16a1 1 0 0 1-1 1h-3.5v-5h-5v5H4a1 1 0 0 1-1-1Z"/></svg></button>
    <nav class="crumbs" aria-label="Breadcrumb"><ol id="crumbs">{{CRUMBS}}</ol></nav>
  </div>

  <main class="main">
    <section class="stage" id="stage" aria-label="Interactive computer visualization">
      <div class="scroller" id="scroller"><div id="layers"></div></div>
      <button class="btn zoom-btn" id="btn-zoom" type="button" aria-pressed="false"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4.5 4.5M6 8.5h5M8.5 6v5"/></svg><span>Zoom diagram</span></button>
      <p class="nojs">The interactive diagram needs JavaScript. The full explanation is in the panel.</p>
      <ol class="depth" id="depth" aria-label="Exploration depth">{{DEPTH}}</ol>
      <div class="stage-tools" id="stage-tools"><button class="btn" id="btn-reset-layout" type="button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10a6 6 0 1 0 2-4.5"/><path d="M4 3.5V6h2.5"/></svg><span>Reset positions</span></button></div>
      <div class="model-badge" id="model-badge"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M8 7.2v4M8 4.6v.1"/></svg>Simplified educational model</div>
      <div class="hint" id="hint" aria-hidden="true">Click a part to zoom in</div>
      <div class="tip" id="tip" role="tooltip"></div>
    </section>
    <nav class="strip" id="strip" aria-label="Parts in this view">{{STRIP}}</nav>
    <aside class="panel" id="panel" aria-label="Component information">
      <article class="panel-inner" id="panel-inner">{{PANEL}}</article>
    </aside>
  </main>
</div>

<dialog id="overview" aria-labelledby="ov-title">
  <div class="dlg-head">
    <div><h2 id="ov-title">Everything inside</h2><p>Jump straight to any part. The current one is highlighted.</p></div>
    <button class="btn icon" id="ov-close" type="button" aria-label="Close overview"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button>
  </div>
  <nav class="tree" id="tree" aria-label="All components">{{TREE}}</nav>
</dialog>
<div class="sr-only" id="announce" aria-live="polite"></div>

<!-- Order matters: core → data → panel → scenes → engine -->
<script src="{{ROOT}}js/core.js"></script>
<script src="{{ROOT}}js/data/hardware.js"></script>
<script src="{{ROOT}}js/data/devices.js"></script>
<script src="{{ROOT}}js/data/cpu.js"></script>
<script src="{{ROOT}}js/data/alu.js"></script>
<script src="{{ROOT}}js/data/logic.js"></script>
<script src="{{ROOT}}js/data/chips.js"></script>
<script src="{{ROOT}}js/panel.js"></script>
<script src="{{ROOT}}js/scenes/common.js"></script>
<script src="{{ROOT}}js/scenes/hardware.js"></script>
<script src="{{ROOT}}js/scenes/cpu.js"></script>
<script src="{{ROOT}}js/scenes/alu.js"></script>
<script src="{{ROOT}}js/scenes/logic.js"></script>
<script src="{{ROOT}}js/engine.js"></script>
</body>
</html>
